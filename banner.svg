<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jose Manuel Rengifo Correa — AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- Grafo de agentes (decorativo) -->
  <g stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M900 90 L1010 150 L900 210 M1010 150 L1110 95 M1010 150 L1110 205 M900 90 L900 210"/>
  </g>
  <g fill="#f5f3ff">
    <circle cx="900" cy="90" r="9" fill-opacity="0.9"/>
    <circle cx="900" cy="210" r="9" fill-opacity="0.9"/>
    <circle cx="1010" cy="150" r="14" fill="url(#accent)"/>
    <circle cx="1110" cy="95" r="9" fill-opacity="0.9"/>
    <circle cx="1110" cy="205" r="9" fill-opacity="0.9"/>
  </g>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="70" y="118" font-size="50" font-weight="700" fill="#ffffff">Jose Manuel Rengifo Correa</text>
    <text x="72" y="166" font-size="26" font-weight="600" fill="url(#accent)">AI Engineer · Generative AI &amp; AI Agents</text>
    <text x="72" y="214" font-size="19" fill="#ddd6fe">LangGraph · Google ADK · RAG · Multiagentes · GCP &amp; AWS</text>
    <text x="72" y="250" font-size="16" fill="#a5b4fc">Medellín, Colombia</text>
